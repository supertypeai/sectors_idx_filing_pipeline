name: Refresh Company Map

on:
  schedule:
    - cron: "0 3 1 * *" # 10:00 am wib 
  workflow_dispatch:

concurrency:
  group: refresh-company-map
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Refresh company map
        env:
          PROXY: ${{ secrets.PROXY }}
          NO_PROXY: "localhost,127.0.0.1,supabase.co,.supabase.co"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          uv run python -m idx_pipeline.scripts.refresh_company_map

      - name: Commit company map
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_v2/idx_companies/company_map.json

          if git diff --staged --quiet; then
            echo "No company map changes to commit."
          else
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git commit -m "chore: refresh company map"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
