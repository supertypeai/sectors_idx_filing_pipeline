name: IDX Filings V2

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional. YYYYMMDD or 'YYYY-MM-DD HH:MM'. Leave blank to use last_run state."
        required: false
      end_date:
        description: "Optional. YYYYMMDD or 'YYYY-MM-DD HH:MM'. Leave blank to use last_run state."
        required: false
      is_push_db:
        description: "Push filings/news to Supabase"
        type: boolean
        required: true
        default: true
      is_send_alert:
        description: "Send alert email for not-inserted filings"
        type: boolean
        required: true
        default: false

concurrency:
  group: idx-filings-v2
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src_v2
      TZ: Asia/Jakarta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Compute run timestamp (WIB)
        id: ts
        run: echo "stamp=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        env:
          PROXY: ${{ secrets.PROXY }}
          NO_PROXY: "localhost,127.0.0.1,supabase.co,.supabase.co,amazonaws.com,.amazonaws.com,generativelanguage.googleapis.com,.googleapis.com,translate.google.com,.google.com,openai.com,.openai.com,groq.com,.groq.com"
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:          ${{ secrets.SUPABASE_KEY }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
          SES_FROM_EMAIL:        ${{ secrets.SES_FROM_EMAIL }}
          ALERT_TO_EMAIL:        ${{ secrets.ALERT_TO_EMAIL }}
          GROQ_API_KEY_DEV:      ${{ secrets.GROQ_API_KEY_DEV }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
        run: |
          set -euo pipefail
          mkdir -p data_v2/ingestion data_v2/alert data_v2/state data_v2/parser

          ARGS=()

          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"

          if [[ -n "${START:-}" || -n "${END:-}" ]]; then
            [[ -n "${START:-}" && -n "${END:-}" ]] || { echo "::error::start_date and end_date must both be set"; exit 1; }
            ARGS+=("--start-date" "${START}" "--end-date" "${END}")
          fi

          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.is_push_db }}" == "true" ]]; then
            ARGS+=("--is-push-db")
          else
            ARGS+=("--no-is-push-db")
          fi

          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.is_send_alert }}" == "true" ]]; then
            ARGS+=("--is-send-alert")
          else
            ARGS+=("--no-is-send-alert")
          fi

          echo "Running: uv run python -m idx_pipeline.pipeline run ${ARGS[*]}"
          uv run python -m idx_pipeline.pipeline run "${ARGS[@]}"

      - name: Persist state
        if: always()
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_v2/state 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git commit -m "chore: update pipeline state"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filings-v2-${{ steps.ts.outputs.stamp }}-run${{ github.run_number }}
          path: data_v2/**/*.json
          if-no-files-found: warn
          retention-days: 90
